services:
  mongodb:
    image: mongo:7.0
    container_name: muchtodo-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
      MONGO_INITDB_DATABASE: much_todo_db
    volumes:
      - mongo-data:/data/db
    networks:
      - muchtodo-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muchtodo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGO_URI: "mongodb://admin:secret123@mongodb:27017/much_todo_db?authSource=admin"
      DB_NAME: "much_todo_db"
      JWT_SECRET_KEY: "super-secret-jwt-key-change-in-production"
      JWT_EXPIRATION_HOURS: "72"
      ENABLE_CACHE: "false"
      LOG_LEVEL: "DEBUG"
      LOG_FORMAT: "text"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - muchtodo-network

networks:
  muchtodo-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local