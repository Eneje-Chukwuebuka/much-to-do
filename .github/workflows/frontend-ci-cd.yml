name: Frontend CI/CD

on:
  push:
    branches: [feature/full-stack]
    paths:
      - 'Client/**'
  pull_request:
    branches: [feature/full-stack]
    paths:
      - 'Client/**'

env:
  AWS_REGION: "us-east-1"
  S3_BUCKET: "starttech-frontend-prod-394747153553"
  CLOUDFRONT_DISTRIBUTION_ID: "EEEBWSRKU27B7"

jobs:
  build-and-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: "http://${{ secrets.ALB_DNS_NAME }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        if: github.ref == 'refs/heads/feature/full-stack' && github.event_name == 'push'
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html"

          aws s3 cp dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        if: github.ref == 'refs/heads/feature/full-stack' && github.event_name == 'push'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        if: github.ref == 'refs/heads/feature/full-stack' && github.event_name == 'push'
        run: |
          echo "✅ Frontend deployed to S3"
          echo "🌍 Live at: https://${{ secrets.CLOUDFRONT_DOMAIN }}"
